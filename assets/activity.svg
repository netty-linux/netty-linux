<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Netty activity status</title><desc id="desc">Painel monocromático de atividade e modo de trabalho.</desc>
  <defs><pattern id="scan" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M0 0H5" stroke="#fff" stroke-opacity="0.055"/></pattern></defs>
  <rect width="1200" height="300" rx="4" fill="#050505"/><rect width="1200" height="300" rx="4" fill="url(#scan)"/>
  <text x="54" y="50" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="900" letter-spacing="1">ACTIVITY / PUBLIC SIGNAL</text>
  <text x="54" y="76" fill="#888" font-family="Courier New,monospace" font-size="12">github.com/netty-linux / profile snapshot</text>
  <path d="M54 96H1146" stroke="#fff" stroke-opacity="0.3"/>
  <g font-family="Courier New,monospace">
    <text x="54" y="132" fill="#fff" font-size="13">01</text><text x="105" y="132" fill="#fff" font-size="14" font-weight="700">OPEN SOURCE</text><rect x="300" y="119" width="590" height="16" fill="#222"/><rect x="300" y="119" width="500" height="16" fill="#fff"/><text x="930" y="132" fill="#888" font-size="12">VISIBLE</text>
    <text x="54" y="182" fill="#fff" font-size="13">02</text><text x="105" y="182" fill="#fff" font-size="14" font-weight="700">SHIPPING</text><rect x="300" y="169" width="590" height="16" fill="#222"/><rect x="300" y="169" width="430" height="16" fill="#fff"/><text x="930" y="182" fill="#888" font-size="12">IN MOTION</text>
    <text x="54" y="232" fill="#fff" font-size="13">03</text><text x="105" y="232" fill="#fff" font-size="14" font-weight="700">EXPERIMENTS</text><rect x="300" y="219" width="590" height="16" fill="#222"/><rect x="300" y="219" width="555" height="16" fill="#fff"/><text x="930" y="232" fill="#888" font-size="12">ALWAYS ON</text>
  </g>
  <text x="54" y="270" fill="#666" font-family="Courier New,monospace" font-size="12">status: shipping / mode: deep work / output: public</text>
